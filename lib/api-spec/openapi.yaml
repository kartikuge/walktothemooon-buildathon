openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /moon/places:
    get:
      operationId: searchPlaces
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}
      responses:
        "200":
          description: Matching cities
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/City"}}
  /moon/map-preview:
    post:
      operationId: previewMap
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MapPreviewInput"}
      responses:
        "200":
          description: Verified distance and geometry, saved for adding a Map
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MapPreview"}
  /moon/maps:
    post:
      operationId: addMap
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MapInput"}
      responses:
        "201":
          description: Map enrollment created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Journey"}
  /moon/maps/{mapId}/goal-date:
    patch:
      operationId: updateMapGoalDate
      description: Solo owners or any current team member may edit the goal date. Progress is unchanged.
      parameters:
        - {name: mapId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MapGoalDateInput"}
      responses:
        "200":
          description: Updated Map with recalculated targets
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Journey"}
        "400":
          description: Invalid date or runner
        "403":
          description: Runner does not own or belong to this Map
        "404":
          description: Map or runner not found
  /moon/activity/{userId}:
    get:
      operationId: getActivityProfile
      parameters:
        - {name: userId, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Saved personal activity schedule
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityProfile"}
    put:
      operationId: saveActivityProfile
      parameters:
        - {name: userId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivityInput"}
      responses:
        "200":
          description: Saved activity schedule
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityProfile"}
  /moon/estimates:
    post:
      operationId: estimateMap
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EstimateInput"}
      responses:
        "200":
          description: Shared effort and finish estimate
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MapEstimate"}
  /moon/profile:
    get:
      operationId: getRunnerProfile
      parameters:
        - {name: userId, in: query, required: true, schema: {type: integer}}
        - {name: today, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Route catalog, passport and lifetime stats
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunnerProfile"}
  /moon/teams:
    post:
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TeamInput"}
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeamReceipt"}
  /moon/teams/join:
    post:
      operationId: joinTeam
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JoinInput"}
      responses:
        "200":
          description: Joined team
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeamReceipt"}
  /moon/state:
    get:
      operationId: getMoonState
      parameters:
        - {name: userId, in: query, required: true, schema: {type: integer}}
        - {name: today, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Running dashboard and competition
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MoonState"}
  /moon/runs:
    post:
      operationId: logRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunInput"}
      responses:
        "201":
          description: Saved run and any newly earned stamp
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunResult"}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    City:
      type: object
      required: [id, name, label, latitude, longitude]
      properties:
        id: {type: integer}
        name: {type: string}
        label: {type: string}
        latitude: {type: number}
        longitude: {type: number}
    MapGeometry:
      type: object
      required: [mode, coordinates, attribution, description]
      properties:
        mode: {type: string, enum: [virtual, walking, event, preset]}
        coordinates:
          type: array
          description: Ordered latitude longitude pairs
          items: {type: array, items: {type: number}, minItems: 2, maxItems: 2}
        origin: {$ref: "#/components/schemas/City"}
        destination: {$ref: "#/components/schemas/City"}
        attribution: {type: string}
        description: {type: string}
    MapPreviewInput:
      type: object
      required: [originId, destinationId, mode]
      properties:
        originId: {type: integer}
        destinationId: {type: integer}
        mode: {type: string, enum: [virtual, walking]}
    MapPreview:
      type: object
      required: [previewId, name, totalMiles, geometry]
      properties:
        previewId: {type: string}
        name: {type: string}
        totalMiles: {type: number}
        geometry: {$ref: "#/components/schemas/MapGeometry"}
    MapInput:
      type: object
      required: [userId, teamId, endDate, today]
      properties:
        userId: {type: integer}
        teamId: {type: [integer, "null"]}
        routeId: {type: integer}
        previewId: {type: string}
        endDate: {type: string}
        today: {type: string}
    MapGoalDateInput:
      type: object
      required: [userId, endDate, today]
      properties:
        userId: {type: integer, minimum: 1}
        endDate: {type: string}
        today: {type: string}
    ActivitySession:
      type: object
      required: [id, name, miles, days]
      properties:
        id: {type: string, minLength: 1, maxLength: 100}
        name: {type: string, minLength: 1, maxLength: 80}
        miles: {type: number, minimum: 0.01, maximum: 200}
        days: {type: array, minItems: 1, maxItems: 7, items: {type: integer, minimum: 0, maximum: 6}}
    ActivityInput:
      type: object
      required: [homeCity, dailyMiles, restDays, commuteMiles, commuteDays, sessions]
      properties:
        homeCity:
          anyOf:
            - {$ref: "#/components/schemas/City"}
            - {type: "null"}
        dailyMiles: {type: number, minimum: 0, maximum: 200}
        restDays: {type: array, maxItems: 7, items: {type: integer, minimum: 0, maximum: 6}}
        commuteMiles: {type: number, minimum: 0, maximum: 100}
        commuteDays: {type: array, maxItems: 7, items: {type: integer, minimum: 0, maximum: 6}}
        sessions: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/ActivitySession"}}
    ActivityProfile:
      allOf:
        - {$ref: "#/components/schemas/ActivityInput"}
        - type: object
          required: [userId, configured, weeklyMiles]
          properties:
            userId: {type: integer}
            configured: {type: boolean}
            weeklyMiles: {type: number}
    EstimateInput:
      type: object
      required: [userId, teamId, totalMiles, today, endDate]
      properties:
        userId: {type: integer}
        teamId: {type: [integer, "null"]}
        participantCount: {type: integer, minimum: 1, maximum: 10000}
        totalMiles: {type: number, minimum: 0, maximum: 100000}
        today: {type: string}
        endDate: {type: string}
    MapEstimate:
      type: object
      required: [participantCount, actualMemberCount, configuredProfiles, scenario, calendarDays, activeDays, requiredPerPersonDay, requiredPerActiveDay, milesPerPerson, weeklyMiles, projectedMilesByGoal, expectedFinishDate, daysToFinish, withinGoal, explanation]
      properties:
        participantCount: {type: integer}
        actualMemberCount: {type: integer}
        configuredProfiles: {type: integer}
        scenario: {type: boolean}
        calendarDays: {type: integer}
        activeDays: {type: integer}
        requiredPerPersonDay: {type: [number, "null"]}
        requiredPerActiveDay: {type: [number, "null"]}
        milesPerPerson: {type: number}
        weeklyMiles: {type: number}
        projectedMilesByGoal: {type: number}
        expectedFinishDate: {type: [string, "null"]}
        daysToFinish: {type: [integer, "null"]}
        withinGoal: {type: [boolean, "null"]}
        explanation: {type: string}
    RouteInfo:
      type: object
      required: [id, name, type, totalMiles, emoji, gradientFrom, gradientTo]
      properties:
        geometry: {$ref: "#/components/schemas/MapGeometry"}
        id: {type: integer}
        name: {type: string}
        type: {type: string}
        totalMiles: {type: number}
        emoji: {type: string}
        gradientFrom: {type: string}
        gradientTo: {type: string}
    RunnerProfile:
      type: object
      required: [routes, stamps, teams, totalMiles, totalMinutes, longestRun, mapsCompleted, currentStreak, restDays]
      properties:
        routes: {type: array, items: {$ref: "#/components/schemas/RouteInfo"}}
        stamps: {type: array, items: {$ref: "#/components/schemas/Stamp"}}
        teams: {type: array, items: {$ref: "#/components/schemas/TeamReceipt"}}
        totalMiles: {type: number}
        totalMinutes: {type: number}
        longestRun: {type: number}
        mapsCompleted: {type: integer}
        currentStreak: {type: integer}
        restDays: {type: array, items: {type: integer}}
    TeamInput:
      type: object
      required: [userId, name, routeId, endDate, today]
      properties:
        userId: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 80}
        routeId: {type: integer, minimum: 1}
        endDate: {type: string}
        today: {type: string}
    JoinInput:
      type: object
      required: [userId, inviteCode]
      properties:
        userId: {type: integer, minimum: 1}
        inviteCode: {type: string, minLength: 6, maxLength: 6}
    TeamReceipt:
      type: object
      required: [id, name, inviteCode, routeId, endDate]
      properties:
        id: {type: integer}
        name: {type: string}
        inviteCode: {type: string}
        routeId: {type: integer}
        endDate: {type: string}
    User:
      type: object
      required: [id, name, avatarEmoji, restDays]
      properties:
        id: {type: integer}
        name: {type: string}
        avatarEmoji: {type: string}
        restDays: {type: array, items: {type: integer}}
    Journey:
      type: object
      required: [id, routeId, name, teamName, totalMiles, miles, remainingMiles, daysRemaining, dailyTarget, memberCount, topContributor, emoji, gradientFrom, gradientTo, endDate, completed, type]
      properties:
        mapId: {type: integer}
        geometry: {$ref: "#/components/schemas/MapGeometry"}
        id: {type: string}
        routeId: {type: integer}
        teamId: {type: [integer, "null"]}
        name: {type: string}
        teamName: {type: string}
        totalMiles: {type: number}
        miles: {type: number}
        remainingMiles: {type: number}
        daysRemaining: {type: integer}
        dailyTarget: {type: number}
        memberCount: {type: integer}
        topContributor: {type: string}
        emoji: {type: string}
        gradientFrom: {type: string}
        gradientTo: {type: string}
        endDate: {type: string}
        completed: {type: boolean}
        type: {type: string}
    Stamp:
      type: object
      required: [routeId, routeName, emoji, earnedAt, earnedWithTeam]
      properties:
        routeId: {type: integer}
        routeName: {type: string}
        emoji: {type: string}
        earnedAt: {type: string}
        earnedWithTeam: {type: boolean}
    Competition:
      type: object
      required: [name, endDate, teams]
      properties:
        name: {type: string}
        endDate: {type: string}
        winnerTeamId: {type: [integer, "null"]}
        teams: {type: array, items: {$ref: "#/components/schemas/Journey"}}
    MoonState:
      type: object
      required: [users, moonMiles, moonGoal, journeys, dailyTarget, restDay, stamps, competition]
      properties:
        users: {type: array, items: {$ref: "#/components/schemas/User"}}
        moonMiles: {type: number}
        moonGoal: {type: number}
        journeys: {type: array, items: {$ref: "#/components/schemas/Journey"}}
        dailyTarget: {type: number}
        restDay: {type: boolean}
        stamps: {type: array, items: {$ref: "#/components/schemas/Stamp"}}
        competition: {$ref: "#/components/schemas/Competition"}
    RunInput:
      type: object
      required: [userId, routeId, teamId, miles, durationMinutes, loggedAt, requestId]
      properties:
        mapId: {type: integer}
        userId: {type: integer, minimum: 1}
        routeId: {type: integer, minimum: 1}
        teamId: {type: [integer, "null"]}
        miles: {type: number, exclusiveMinimum: 0, maximum: 1000}
        durationMinutes: {type: number, exclusiveMinimum: 0, maximum: 100000}
        loggedAt: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        requestId: {type: string, minLength: 1, maxLength: 100}
    RunResult:
      type: object
      required: [milesAdded, moonMiles, completed, routeName, emoji]
      properties:
        milesAdded: {type: number}
        moonMiles: {type: number}
        completed: {type: boolean}
        routeName: {type: string}
        emoji: {type: string}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

